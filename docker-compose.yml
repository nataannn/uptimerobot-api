version: '3.8'

services:
  api:
    build: .
    container_name: uptimerobot-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3